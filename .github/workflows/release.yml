name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release Tarball
        run: |
          tar -czf skill-artifact.tar.gz src/ skill.yaml schema/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: skill-artifact.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
