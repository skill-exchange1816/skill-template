name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema pytest
      - name: Validate manifest
        run: |
          python -c "import yaml, json, jsonschema; manifest=yaml.safe_load(open('skill.yaml')); schema=json.load(open('schema/skill.schema.json')); jsonschema.validate(instance=manifest, schema=schema)"
      - name: Run tests
        run: |
          pytest
